<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CST 연습 시뮬레이터</title>
<style>
:root{
  /* CST 2025 화면을 닮은 업무용 UI: 짙은 파란 제목줄, 밝은 회색 리본, 흰 패널 */
  --title:#0f3a6b;
  --ribbon:#f4f5f7;
  --panel:#ffffff;
  --line:#c9ced6;
  --ink:#1b1f27;
  --muted:#5d6675;
  --accent:#1d5fa8;
  --sel:#cfe3fb;
  --warn:#b26b00;
  --err:#c01919;
  --ok:#1e7a34;
  --ui:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:Consolas,"SF Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--ui);color:var(--ink);background:#e7e9ee;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;grid-template-rows:30px 26px 92px minmax(0,1fr) 170px 22px;height:100%}
#titlebar{background:var(--title);color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12.5px}
#titlebar .logo{width:18px;height:18px;border:2px solid #fff;border-radius:3px;display:grid;place-items:center;font-weight:700;font-size:11px}
#titlebar .tag{margin-left:auto;background:#ffcf4d;color:#3b2a00;border-radius:3px;padding:1px 8px;font-weight:700;font-size:11.5px}
#rtabs{background:var(--title);display:flex;gap:2px;padding:0 8px;align-items:flex-end}
.rt{background:transparent;color:#dfe9f7;border:0;padding:4px 14px;border-radius:3px 3px 0 0;font-size:12.5px}
.rt:hover{background:rgba(255,255,255,.12)}
.rt.on{background:var(--ribbon);color:var(--ink)}
#ribbon{background:var(--ribbon);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;overflow-y:hidden}
.rg{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:4px 6px 0}
.rb{display:flex;gap:2px;flex:1}
.rgl{text-align:center;color:var(--muted);font-size:11px;padding:1px 0 3px}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:1px solid transparent;border-radius:3px;padding:3px 6px;min-width:58px;max-width:92px;font-size:11.5px;color:var(--ink);line-height:1.15;text-align:center}
.rbtn:hover{background:#e3ecf8;border-color:#b7cbe6}
.rbtn.on{background:#cfe0f6;border-color:#8fb0dc}
#main{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;min-height:0}
#nav,#mission{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#mission{border-right:0;border-left:1px solid var(--line)}
.ph{font-size:12px;font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line);background:#eef1f5}
#tree{overflow:auto;flex:1;padding:4px 0;font-size:12.5px}
#tree ul{list-style:none;margin:0;padding-left:12px}
#tree>ul{padding-left:4px}
.tn{display:flex;align-items:center;gap:4px;padding:1px 4px;border-radius:2px;cursor:default;white-space:nowrap}
.tn:hover{background:#eef4fc}
.tn.sel{background:var(--sel)}
.tw{width:12px;color:var(--muted);cursor:pointer;flex:none;text-align:center}
.sw{width:11px;height:11px;border:1px solid rgba(0,0,0,.35);border-radius:2px;flex:none;display:inline-block}
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:#d7dbe2}
#vtabs{display:flex;gap:2px;padding:3px 4px 0;background:#e9ecf1;border-bottom:1px solid var(--line);overflow-x:auto}
.vt{border:1px solid var(--line);border-bottom:0;background:#f5f6f8;border-radius:3px 3px 0 0;padding:2px 10px;font-size:12px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.vt.on{background:#fff;font-weight:600}
.vx{color:#a00;font-weight:700;padding:0 2px}
#vp{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{display:block}
#vpHint{position:absolute;left:12px;top:10px;right:12px;background:rgba(255,255,255,.95);border:1px solid #f0a040;border-left:5px solid #f08a00;border-radius:4px;padding:6px 10px;font-size:13px;max-width:720px}
#resPane{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
#resPane[hidden],#vpHint[hidden]{display:none}
.simnote{background:#fff7dd;color:#6a4b00;border-bottom:1px solid #f0d58a;padding:4px 10px;font-size:12px}
.ffbar{padding:6px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ffinfo{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.95);border:2px solid #d00;padding:6px 10px;font-size:12px;line-height:1.5;z-index:2}
.empty{padding:30px;color:var(--muted)}
#bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line);min-height:0}
#params,#msgs{background:var(--panel);display:flex;flex-direction:column;min-height:0}
#params{border-right:1px solid var(--line)}
#ptabwrap{overflow:auto;flex:1}
#ptab{border-collapse:collapse;width:100%;font-size:12px}
#ptab th{position:sticky;top:0;background:#f3f5f8;text-align:left;font-weight:600;border-bottom:1px solid var(--line);padding:2px 6px}
#ptab td{border-bottom:1px solid #edf0f4;padding:1px 6px;font-variant-numeric:tabular-nums}
#ptab input{width:100%;border:1px solid transparent;background:transparent;font:12px var(--mono);padding:1px 3px}
#ptab input:hover,#ptab input:focus{border-color:#9db8dc;background:#fff}
#ptab .pd{color:var(--muted)}
#ptab .bad{color:var(--err)}
#ptab .newp input{border:1px dashed #b9c4d3}
#msglist{overflow:auto;flex:1;padding:2px 0;font-size:12.5px}
.m{display:flex;gap:6px;padding:2px 8px;border-bottom:1px solid #f1f3f6}
.mi{width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:#3a78c3;margin-top:1px}
.m.warn .mi{background:#e09a00}.m.err .mi{background:var(--err)}.m.ok .mi{background:var(--ok)}
.m.err{color:var(--err)}
#prog{display:flex;align-items:center;gap:8px;padding:3px 8px;border-top:1px solid var(--line);font-size:12px}
#pbarw{flex:0 0 180px;height:10px;background:#e2e6ec;border-radius:5px;overflow:hidden}
#pbar{height:100%;width:0;background:#2b8a3e}
#status{background:#f0f2f5;border-top:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:0 10px;font-size:11.5px;color:var(--muted)}
#status span:last-child{margin-left:auto}
.lnk{background:none;border:0;color:var(--err);padding:0 4px}
/* mission */
.mh{padding:8px 10px;border-bottom:1px solid var(--line);background:#f6f8fb}
.mt{font-weight:700;font-size:14px}
.mp{height:6px;background:#e1e6ee;border-radius:3px;margin:6px 0 3px;overflow:hidden}
.mpb{height:100%;background:var(--ok)}
.mpt{font-size:11.5px;color:var(--muted)}
.mtabs{display:flex;gap:4px;margin-top:6px}
.mtabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px}
.mtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mb{overflow:auto;flex:1;padding:8px}
.coord{background:#eef4fc;border-radius:5px;padding:6px 8px;font-size:12px;margin-bottom:8px}
.st{border:1px solid var(--line);border-radius:6px;margin-bottom:5px;background:#fff}
.st.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.st.done{background:#f3faf4}
.sth{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:6px 8px}
.sn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:#dfe5ee;font-size:11.5px;font-weight:700}
.st.cur .sn{background:var(--accent);color:#fff}
.st.done .sn{background:var(--ok);color:#fff}
.stt{font-weight:600}
.stb{padding:0 10px 8px 36px;font-size:12.5px}
.stb p{margin:0 0 6px}
details summary{cursor:pointer;color:var(--accent);font-size:12px}
table.ans{border-collapse:collapse;margin:4px 0 6px;font-size:12px;width:100%}
table.ans th{text-align:left;font-weight:500;color:var(--muted);padding:1px 6px 1px 0;white-space:nowrap;vertical-align:top}
table.ans td code{font:12px var(--mono);background:#f2f4f7;padding:0 4px;border-radius:3px}
.alldone{background:#e7f6ea;border:1px solid #9fd3aa;border-radius:6px;padding:8px;margin-top:6px}
details.live{margin-top:10px;font-size:12px}
details.live table{border-collapse:collapse;margin-top:4px}
details.live td{padding:1px 8px 1px 0;font-variant-numeric:tabular-nums}
.paper .pt{font-weight:700;margin:0 0 6px}
.ptab2{border-collapse:collapse;font-size:12px;width:100%;margin-bottom:8px}
.ptab2 td,.ptab2 th{border-bottom:1px solid #edf0f4;padding:1px 6px;text-align:left;font-variant-numeric:tabular-nums}
.gal{display:grid;gap:8px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.gal img{width:100%;display:block;cursor:zoom-in}
.gal figcaption{font-size:11.5px;padding:3px 6px;color:var(--muted)}
kbd{font:11.5px var(--mono);border:1px solid #b9c1cd;border-bottom-width:2px;border-radius:3px;padding:0 5px;background:#f6f7f9}
code{font:12px var(--mono)}
.chip{border:1px solid #f08a00;background:#fff3e2;border-radius:10px;padding:0 9px;margin-left:6px;font-size:12px}
/* dialogs */
#modal{position:fixed;inset:0;background:rgba(20,30,50,.18);display:flex;align-items:flex-start;justify-content:center;padding-top:9vh;z-index:20}
#modal[hidden]{display:none}
.dlg{background:#fff;border:1px solid #8b97a8;border-radius:5px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(430px,94vw);max-height:84vh;display:flex;flex-direction:column}
.dlg.wide{width:min(640px,96vw)}
.dh{background:#eef1f5;border-bottom:1px solid var(--line);padding:6px 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;border-radius:5px 5px 0 0}
.dx{border:0;background:none;font-size:18px;line-height:1}
.db{padding:10px 12px;overflow:auto}
.df{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--line)}
.btn{border:1px solid #a9b4c3;background:#f7f8fa;border-radius:4px;padding:4px 14px}
.btn:hover{background:#eaf0f8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:2px 10px;font-size:12px;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px}
.g2 .full{grid-column:1/-1}
.db label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.db label.chk,.radio label{flex-direction:row;align-items:center;gap:5px;color:var(--ink)}
.db label.inl{flex-direction:row;align-items:center;gap:8px;margin-top:6px}
.radio{display:flex;gap:14px}
.db input:not([type=radio]):not([type=checkbox]):not([type=color]),.db select{border:1px solid #b5bfcc;border-radius:3px;padding:3px 6px;font:12.5px var(--mono);color:var(--ink);background:#fff;min-width:0}
.db input:disabled{background:#f1f3f6;color:#888}
fieldset{border:1px solid var(--line);border-radius:4px;margin:8px 0;padding:6px 8px}
legend{font-size:12px;color:var(--muted)}
.pg{display:grid;grid-template-columns:24px repeat(4,minmax(0,1fr));gap:4px 6px;align-items:center;font-size:12px}
.pg b{font-weight:500;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:8px 0 0}
.dp{margin:0 0 8px}
.derr{color:var(--err);font-size:12px;min-height:16px;margin-top:6px}
.mlist{border:1px solid var(--line);height:180px;overflow:auto;margin:6px 0;border-radius:3px}
.mi2{padding:3px 8px;display:flex;gap:6px;align-items:center;cursor:pointer}
.mi2:hover{background:#eef4fc}.mi2.on{background:var(--sel)}
.minfo{background:#f5f7fa;border-radius:4px;padding:6px 8px;font-size:12px}
.tlist{margin-top:10px;font-size:12px;border-top:1px solid var(--line);padding-top:6px}
.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.pcard img{width:100%;height:120px;object-fit:cover;object-position:top}
.pc{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc small{color:var(--muted);font-size:11px;line-height:1.35}
.pcb{display:flex;gap:6px;margin-top:auto;padding-top:6px}
#ctx{position:fixed;background:#fff;border:1px solid #8b97a8;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:30;font-size:12.5px;min-width:190px}
#ctx[hidden]{display:none}
#ctx div{padding:4px 12px;cursor:pointer}#ctx div:hover{background:var(--sel)}
#lb{position:fixed;inset:0;background:rgba(5,10,20,.85);z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:88vh;background:#fff;border-radius:4px}
@media (max-width:1100px){#main{grid-template-columns:200px minmax(0,1fr) 280px}}
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-rows:30px 26px 92px 520px auto auto 22px;height:auto}
  #main{grid-template-columns:1fr;grid-template-rows:160px 420px auto}
  #mission{border-left:0;border-top:1px solid var(--line);max-height:520px}
  #bottom{grid-template-columns:1fr;grid-template-rows:200px 160px}
  .pcards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar"><span class="logo">S</span><span id="ttl">CST Studio Suite 2025 - [Learning Edition]</span><span class="tag">연습용 모의 프로그램 · 실제 CST 아님</span></div>
  <div id="rtabs"></div>
  <div id="ribbon"></div>
  <div id="main">
    <div id="nav"><div class="ph">Navigation Tree</div><div id="tree"></div></div>
    <div id="center">
      <div id="vtabs"></div>
      <div id="vp"><canvas id="cv"></canvas><div id="vpHint" hidden></div><div id="resPane" hidden></div></div>
    </div>
    <div id="mission"></div>
  </div>
  <div id="bottom">
    <div id="params"><div class="ph">Parameter List</div><div id="ptabwrap"><table id="ptab"></table></div></div>
    <div id="msgs"><div class="ph">Messages</div><div id="msglist"></div><div id="prog"><span>Progress</span><div id="pbarw"><div id="pbar"></div></div><span id="plab">Ready</span></div></div>
  </div>
  <div id="status"><span>Ready</span><span id="stMesh"></span><span>mm · GHz · ns</span></div>
</div>
<div id="modal" hidden></div>
<div id="ctx" hidden></div>
<div id="lb" hidden></div>
<script>window.NO_SLIDES = true;</script>
<script src="data.js"></script>
<script src="data_tp.js"></script>
<script src="data_tp2.js"></script>
<script src="app.js"></script>
<script src="view.js"></script>
<script src="charts.js"></script>
<script src="ui.js"></script>
</body>
</html>
